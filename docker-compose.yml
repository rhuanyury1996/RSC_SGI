services:
  db:
    image: postgres:16-alpine
    container_name: sgi_rsc_db
    environment:
      POSTGRES_DB: sgi_rsc
      POSTGRES_USER: sgi_rsc
      POSTGRES_PASSWORD: sgi_rsc_dev
    ports:
      - "5432:5432"
    volumes:
      - sgi_rsc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgi_rsc -d sgi_rsc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sgi_rsc_pgdata:
