    return `<div class="panel"><h2>Liberação<span>Yellow Book, cap. 2 e 4</span></h2>${c.P ? prodBox(f, c) : ''}<div class="grid" style="margin-top:10px">
      ${selField('Modelo', 'f.disp.modo', d.modo, [['auto', 'Jato livre e pluma gaussiana'], ['pluma', 'Só pluma gaussiana (baixo momento)']], { reload: 1, tip: 'Jato livre (item 4.5.4.1, Chen e Rodi) para liberação de gás com velocidade alta; pluma gaussiana (item 4.5.3) para gás passivo carregado pelo vento.' })}
      ${selField('Direção do jato', 'f.disp.dir', d.dir, [['H', 'Horizontal'], ['V', 'Vertical para cima']], { tip: 'Para jato vertical de gás mais pesado que o ar a altura máxima é limitada (equação 4.79).' })}
      ${selField('Taxa usada', 'f.disp.qFonte', d.qFonte, [['calc', 'Taxa calculada na fonte'], ['man', 'Taxa informada']], { reload: 1 })}
      ${d.qFonte === 'man' ? field('Taxa informada', 'f.disp.qMan', d.qMan, 'kg/s') : `<div class="fld"><span class="fl">Taxa calculada</span><div class="mono" style="padding:9px 0">${fmt(c.dGdt, 5)} kg/s · ${fmt(c.dGdt * 3600, 5)} kg/h</div></div>`}
      ${field('Altura da liberação', 'f.disp.h', d.h, 'm', { tip: 'Altura do ponto de liberação acima do solo (coordenada Z).' })}
      ${field('Altura do receptor', 'f.disp.zr', d.zr, 'm', { ph: 'vazio = altura da liberação', tip: 'Altura em que a concentração é avaliada. Para extensão de zona use a altura da liberação; o Purple Book usa 1 m para pessoas.' })}</div></div>
      <div class="panel"><h2>Meteorologia e terreno<span>Purple Book, itens 4.10 e Tabela 4.4</span></h2><div class="grid">
      ${selField('Condições meteorológicas', 'f.disp.meteo', d.meteo, [['PB', 'As 6 classes do Purple Book (B3, D1,5, D5, D9, E5, F1,5)'], ['1', 'Uma classe informada']], { reload: 1, tip: 'O Purple Book pede no mínimo seis classes: estável, neutra e instável, com vento baixo e alto.' })}
      ${d.meteo === '1' ? selField('Classe de Pasquill', 'f.disp.cls', d.cls, Object.entries(PASQ).map(([k, v]) => [k, k + ': ' + v.n])) + field('Vento na altura de referência', 'f.disp.u', d.u, 'm/s') : ''}
      ${field('Altura de referência do vento', 'f.disp.zref', d.zref, 'm')}
      ${selField('Rugosidade do terreno z₀', 'f.disp.z0', d.z0, Z0OPC, { tip: 'Corrige σz (Tabela 4.9 do Yellow Book). Obstáculos grandes não são tratados pelo modelo: o Purple Book recomenda descrição qualitativa ou CFD.' })}
      ${field('Tempo de média', 'f.disp.tav', d.tav, 's', { tip: 'Purple Book: 20 s para inflamáveis e 600 s para tóxicos. Corrige σy pelo fator (t/600)^0,2, mínimo 0,5.' })}
      ${selField('Critério para a extensão', 'f.disp.critExt', d.critExt, [['0', 'LIE'], ['1', '50 % do LIE'], ['2', 'k·LIE (fator k da fonte)']], { tip: 'A extensão adotada é a maior distância entre as condições meteorológicas, no critério escolhido.' })}</div></div>
      <div id="res"></div>`;
  },
  res(f) {

    UI.dpCls = UI.dpCls === undefined ? null : UI.dpCls;
    if (o.miss) return `<div class="panel">${notes(['Falta ' + o.miss + ' para calcular a dispersão.'])}</div>`;
    const c = o.c, j = o.jet;
    const crit = o.crit.map(x => x[0]);
    let h = `<div class="tiles">${tile('Taxa', fmt(o.q, 4), 'kg/s', fmt(o.q * 3600, 4) + ' kg/h')}${tile('LIE na T ambiente', fmt(o.lieKg * 1000, 4), 'g/m³', fmt(c.P.lie_v, 3) + ' % vol')}${tile('Vapor / ar', fmt(o.rhov / o.rhoa, 3), '', 'massa específica relativa')}${tile('Extensão adotada', fmt(o.ext, 3), 'm', crit[o.ic])}</div>`;
    if (j) h += `<div class="panel"><h2>Jato livre<span>Yellow Book 4.5.4.1 · Chen e Rodi</span></h2>${eqTable([
      { sym: 'u<sub>saída</sub>', eq: c.gas.restrito ? 'sônica: √(γ·R·T<sub>e</sub>/M), T<sub>e</sub> = 2T/(γ+1)' : 'velocidade de saída (A.3.2.2)', val: fmt(j.ue, 5), un: 'm/s', ref: 'A.3.2' },

/* ---------- pendências ---------- */
function pendencias() {
  const L = [], add = (n, msg, tab, fid) => L.push({ n, msg, tab, fid });
  const e = S.estudo || {};
  [['projeto', 'Projeto'], ['cliente', 'Cliente'], ['autor', 'Elaborado por']].forEach(([k, l]) => { if (!String(e[k] || '').trim()) add('warn', `Dados do estudo: "${l}" não preenchido.`, 'final'); });
  S.fontes.forEach(f => {
    const st = fonteStatus(f), c = st.c, nm = f.nome || f.id;
    if (!c.P) { add('bad', `${nm}: produto não escolhido.`, 'fonte', f.id); return; }
    if (c.miss.length) add('bad', `${nm}: faltam ${c.miss.join(', ')}.`, f.taxa === 'liq' ? 'liq' : 'gas', f.id);
    else if (!st.zona) add('bad', `${nm}: zona não definida (confira ventilação, f e disponibilidade).`, 'vz', f.id);
    else if (!st.extOk) add('bad', `${nm}: extensão da zona sem valor${st.ext && st.ext.ref ? ' (' + st.ext.ref + ')' : ''}.`, 'disp', f.id);
    c.w.forEach(w => add('warn', `${nm}: ${w}`, 'fonte', f.id));
  });
  usados().forEach(id => {
    const P = prod(id); if (!P) return;
    if (P.fulgor === null || P.fulgor === undefined) add('warn', `Produto "${P.nome}": ponto de fulgor não informado.`, 'produtos');
    if (!P.classeT || !P.grupo) add('warn', `Produto "${P.nome}": grupo de gás e/ou classe de temperatura não informados.`, 'produtos');
    if (!S.anexos.some(a => a.tipo === 'FDS' && a.ref === id && a.arquivo)) add('warn', `Produto "${P.nome}": FDS não anexada.`, 'final');
  });
  S.anexos.filter(a => !a.arquivo).forEach(a => add('warn', `Anexo "${a.titulo}": sem arquivo.`, 'final'));
  if (!S.anexos.some(a => a.tipo === 'Desenho')) add('info', 'Nenhum desenho ou mapa de áreas classificadas cadastrado.', 'final');
  return L;
}

const P_ = t => `<p style="font-family:Calibri,Arial,sans-serif;font-size:11pt;text-align:justify;margin:0 0 6pt;line-height:1.3">${t}</p>`;
const H1_ = t => `<h1 style="font-family:Calibri,Arial,sans-serif;font-size:16pt;color:#17324D;margin:22pt 0 8pt;page-break-before:always">${esc(t)}</h1>`;
const H2_ = t => `<h2 style="font-family:Calibri,Arial,sans-serif;font-size:13pt;color:#24527A;margin:14pt 0 5pt">${esc(t)}</h2>`;
const H4_ = t => `<h4 style="font-family:Calibri,Arial,sans-serif;font-size:10.5pt;color:#555F69;margin:10pt 0 3pt">${esc(t)}</h4>`;
function estudoHTML() {
  const e = S.estudo || {}, hoje = new Date().toLocaleDateString('pt-BR');
  const fs = S.fontes.map(f => ({ f, st: fonteStatus(f) }));
  const nMan = S.fontes.filter(f => f.extMode === 'man').length, nAuto = S.fontes.length - nMan;
  const cnt = k => fs.filter(x => x.st.zona && zonaClass(x.st.c.zona.texto) === k).length;
  const capa = `<div style="text-align:center;margin-top:70pt;font-family:Calibri,Arial,sans-serif"><p style="font-size:11pt;letter-spacing:2px;color:#555F69">RELATÓRIO TÉCNICO</p><h1 style="font-size:22pt;color:#17324D;margin:8pt 0">ESTUDO DE CLASSIFICAÇÃO DE ÁREAS (ATEX)</h1><p style="font-size:11pt">Atmosferas explosivas de gás e vapor inflamável, conforme ABNT NBR IEC 60079-10-1</p><p style="font-size:12pt;margin-top:24pt">Preparado para <b>${esc(e.cliente || '—')}</b>${e.local ? ' | ' + esc(e.local) : ''}</p><p style="font-size:12pt">Projeto: <b>${esc((e.projeto || '—').toUpperCase())}</b></p>
    <table style="border-collapse:collapse;width:90%;margin:30pt auto"><tr>${['Planta', 'Revisão', 'Data', 'Elaborado por'].map(h => `<th style="${TH.s};${TH.h}">${h}</th>`).join('')}</tr><tr>${[e.planta || e.local, e.rev || '0', e.data || hoje, e.autor].map(v => `<td style="${TH.s}">${esc(v || '—')}</td>`).join('')}</tr></table></div>`;
  const sum = H1_('Sumário') + `<ol style="font-family:Calibri,Arial,sans-serif;font-size:11pt;line-height:1.6"><li>Introdução</li><li>Metodologia</li><li>Resultados e discussão</li><li>Conclusão</li></ol><p style="font-family:Calibri,Arial,sans-serif;font-size:11pt">Apêndice A – Memorial de cálculo<br>Anexo A – Fichas de Informações de Segurança (FDS)<br>Anexo B – Desenhos e mapas de áreas classificadas<br>Anexo C – Outros documentos</p>`;
  const c1 = H1_('1 Introdução') + H2_('1.1 Objetivo') + P_(`Este relatório apresenta o estudo de classificação de áreas do projeto <b>${esc(e.projeto || '—')}</b>${e.cliente ? ' (' + esc(e.cliente) + ')' : ''}, com o objetivo de identificar as fontes de risco de gás e vapor inflamável, determinar o tipo de zona (0, 1 ou 2) de cada uma e delimitar a extensão das zonas ao seu redor.`)
    + H2_('1.2 Escopo') + P_(`O estudo abrange <b>${S.fontes.length}</b> fonte(s) de risco e <b>${usados().length}</b> produto(s) ou mistura(s)${e.desenhos ? ', com referência aos desenhos ' + esc(e.desenhos) : ''}.`)
    + H2_('1.3 Documentos de referência') + P_('ABNT NBR IEC 60079-10-1; ABNT NBR ISO/IEC 80079-20-1 (propriedades dos gases e vapores); ABNT NBR IEC 60079-0; ABNT NBR IEC 60079-17; TNO Yellow Book (CPR 14E) e Purple Book (CPR 18E); Fichas de Informações de Segurança dos produtos (Anexo A).');
  const c2 = H1_('2 Metodologia') + H2_('2.1 Fundamentos') + P_('A norma define a zona pela frequência e pela duração da atmosfera explosiva. As definições adotadas estão resumidas a seguir.')
    + T(['Zona', 'Definição'], [['Zona 0', 'Atmosfera explosiva de gás presente continuamente, por longos períodos ou com frequência.'], ['Zona 1', 'Atmosfera explosiva de gás provável de se formar ocasionalmente em operação normal.'], ['Zona 2', 'Atmosfera explosiva de gás improvável em operação normal e, se ocorrer, de curta duração.']])
    + H2_('2.2 Sequência de cálculo') + P_(`Para cada fonte determinou-se: (1) o grau de liberação (contínuo, primário ou secundário, Anexo A.1); (2) a taxa de liberação de gás ou vapor, por escoamento de ${S.fontes.some(f => f.taxa === 'liq') ? 'líquido (A.3.1) e ' : ''}gás (A.3.2)${S.fontes.some(f => f.taxa === 'man') ? ' ou valor informado' : ''}; (3) a vazão mínima de ventilação (dV/dt)min e o volume hipotético Vz (B.5.2); (4) o grau da ventilação (alto, médio ou baixo) e a disponibilidade (boa, satisfatória ou pobre) e, por fim, (5) o tipo de zona pela Tabela B.1, reproduzida abaixo.`) + tabB1()
    + H2_('2.3 Extensão das zonas') + P_(`A extensão foi determinada ${nAuto ? `por dispersão atmosférica, com as equações do Yellow Book (CPR 14E) e do Purple Book (CPR 18E), usando jato livre e pluma gaussiana quando aplicável, e arredondada para cima em múltiplos de 0,5 m (${nAuto} fonte(s))` : ''}${nAuto && nMan ? '; ' : ''}${nMan ? `por valor informado e justificado na tabela de resultados (${nMan} fonte(s))` : ''}. Quando a ventilação é baixa, a zona abrange todo o ambiente (B.5.3).`)
    + H2_('2.4 Produtos e premissas') + P_('As propriedades dos produtos, na ordem de prioridade do cadastro (norma 80079-20-1, cadastro próprio, PubChem), são as da Tabela 1. Misturas usam a lei de Raoult e a regra de Le Chatelier, conforme a aba Misturas.');

  const c4 = H1_('4 Conclusão') + P_(`Foram avaliadas ${S.fontes.length} fonte(s) de risco. O estudo resultou em ${cnt('z0')} fonte(s) com Zona 0, ${cnt('z1')} com Zona 1, ${cnt('z2')} com Zona 2 e ${cnt('zn')} em área não classificada, com as extensões da Tabela de classificação (3.5). Os equipamentos elétricos e não elétricos instalados nas zonas devem ter o grupo e a classe de temperatura compatíveis com os produtos, conforme a ABNT NBR IEC 60079-0.`);
  const saved = UI.memEsc; UI.memEsc = 'todas'; let mem; try { mem = buildMemorial(); } finally { UI.memEsc = saved; }
  const apA = `<div style="page-break-before:always">${mem.html}</div>`;
  const ax = H1_('Anexo A – FDS') + tabAnexosIdx().replace(/Sem dados\./, 'Nenhum anexo cadastrado.') + H1_('Anexo B – Desenhos e mapas') + tabDesenhos();
  return capa + sum + c1 + c2 + c3 + c4 + apA + ax;
}

  const d = e.target.closest('[data-axdel]');
  if (d) { S.anexos = S.anexos.filter(a => a.id !== d.dataset.axdel); delete FILES[d.dataset.axdel]; save(); render(); return; }
  const b = e.target.closest('button'); if (!b) return;
  const novoAx = (tipo, titulo, ref) => { S.useq = (S.useq || 0) + 1; S.anexos.push({ id: 'x' + S.useq, tipo, titulo, ref: ref || '', arquivo: '' }); };
  switch (b.id) {
    case 'fnew2': { S.seq++; const id = 'f' + S.seq; const base = JSON.parse(JSON.stringify(S.fontes[S.fontes.length - 1])); base.id = id; base.nome = 'Fonte ' + S.seq; S.fontes.push(base); S.atual = id; save(); go('fonte'); break; }
    case 'axFds': { let n = 0; usados().forEach(id => { if (!S.anexos.some(a => a.tipo === 'FDS' && a.ref === id)) { novoAx('FDS', 'FDS: ' + ((prod(id) || {}).nome || id), id); n++; } }); save(); render(); toast(n ? n + ' FDS criada(s): anexe os arquivos' : 'Todos os produtos já têm FDS'); break; }
