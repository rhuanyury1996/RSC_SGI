databases:
  - name: sgi-rsc-db
    plan: 0.1c-256mb

services:
  - type: web
    name: sgi-rsc
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DATABASE_URL
        fromDatabase:
          name: sgi-rsc-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: CEO_USERNAME
        value: rfloriano
      - key: CEO_PASSWORD
        sync: false
